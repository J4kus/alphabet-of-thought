<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" font-family="Consolas, 'SF Mono', Menlo, monospace">
  <title>A Sales.aot file in VS Code: syntax colouring, a red squiggle on an "and" Concept, a yellow squiggle on a target-less measurement, and the violation total V in the status bar.</title>
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="740" height="380" rx="8"/></clipPath>
    <pattern id="wavyRed" width="6" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3 Q1.5 1 3 3 T6 3" stroke="#F14C4C" stroke-width="1" fill="none"/>
    </pattern>
    <pattern id="wavyYellow" width="6" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3 Q1.5 1 3 3 T6 3" stroke="#CCA700" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="740" height="380" fill="#1E1E1E"/>
    <!-- tab bar -->
    <rect x="0" y="0" width="740" height="34" fill="#252526"/>
    <rect x="0" y="0" width="118" height="34" fill="#1E1E1E"/>
    <text x="16" y="22" font-size="12" fill="#E7E7E7">Sales.aot</text>
    <circle cx="102" cy="17" r="3" fill="#8A8A8A"/>

    <!-- line numbers -->
    <g font-size="12" fill="#6E7681" text-anchor="end">
      <text x="38" y="60">1</text><text x="38" y="80">2</text><text x="38" y="100">3</text>
      <text x="38" y="120">4</text><text x="38" y="140">5</text><text x="38" y="160">6</text>
      <text x="38" y="180">7</text><text x="38" y="200">8</text><text x="38" y="220">9</text>
      <text x="38" y="240">10</text><text x="38" y="260">11</text>
    </g>

    <!-- code -->
    <g font-size="13">
      <text x="56"  y="60"><tspan fill="#6A737D">- </tspan><tspan fill="#B5CEA8">Motivation</tspan></text>
      <text x="85"  y="80"  fill="#4EC9B0">Sales Stakeholder</text>
      <text x="114" y="100"><tspan fill="#6A737D">- </tspan><tspan fill="#B5CEA8">Mike</tspan></text>
      <text x="85"  y="120" fill="#4EC9B0">Growth and Retention</text>
      <text x="85"  y="140"><tspan fill="#6A737D">- </tspan><tspan fill="#B5CEA8">revenue growth</tspan></text>
      <text x="114" y="160"><tspan fill="#9CDCFE">owner</tspan><tspan fill="#6A737D">: </tspan><tspan fill="#CE9178">Mike</tspan></text>
      <text x="114" y="180"><tspan fill="#9CDCFE">actual</tspan><tspan fill="#6A737D">: </tspan><tspan fill="#CE9178">11%</tspan></text>
      <text x="114" y="200"><tspan fill="#9CDCFE">target</tspan><tspan fill="#6A737D">: </tspan><tspan fill="#CE9178">15%</tspan></text>
      <text x="114" y="220"><tspan fill="#9CDCFE">influence</tspan><tspan fill="#6A737D">: </tspan><tspan fill="#CE9178">Amber</tspan></text>
      <text x="114" y="240"><tspan fill="#6A737D">- </tspan><tspan fill="#B5CEA8">churn</tspan></text>
      <text x="143" y="260"><tspan fill="#9CDCFE">actual</tspan><tspan fill="#6A737D">: </tspan><tspan fill="#CE9178">3.1%</tspan></text>
    </g>

    <!-- squiggles -->
    <rect x="85"  y="123" width="146" height="4" fill="url(#wavyRed)"/>
    <rect x="143" y="263" width="88"  height="4" fill="url(#wavyYellow)"/>
    <!-- crosslink: value-is-an-Example, dotted underline -->
    <line x1="165" y1="163" x2="194" y2="163" stroke="#CE9178" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- problems panel -->
    <rect x="0" y="280" width="740" height="72" fill="#252526"/>
    <line x1="0" y1="280" x2="740" y2="280" stroke="#3C3C3C"/>
    <text x="20" y="298" font-size="10" fill="#9D9D9D" letter-spacing="1">PROBLEMS&#160;&#160;2</text>

    <circle cx="30" cy="314" r="6" fill="none" stroke="#F14C4C" stroke-width="1.3"/>
    <line x1="27.7" y1="311.7" x2="32.3" y2="316.3" stroke="#F14C4C" stroke-width="1.2"/>
    <line x1="32.3" y1="311.7" x2="27.7" y2="316.3" stroke="#F14C4C" stroke-width="1.2"/>
    <text x="44" y="318" font-size="12" fill="#CCCCCC">No &#8220;and&#8221; in a Concept &#8212; split &#8220;Growth and Retention&#8221;.<tspan fill="#808080">&#160;&#160;Sales.aot [4, 5] &#183; rule 8</tspan></text>

    <path d="M30 328 L36.5 340 L23.5 340 Z" fill="none" stroke="#CCA700" stroke-width="1.3"/>
    <line x1="30" y1="332" x2="30" y2="336" stroke="#CCA700" stroke-width="1.2"/>
    <circle cx="30" cy="338" r="0.7" fill="#CCA700"/>
    <text x="44" y="338" font-size="12" fill="#CCCCCC">Measurement needs a target &#8212; &#8220;churn&#8221; has an actual only.<tspan fill="#808080">&#160;&#160;Sales.aot [11, 13] &#183; warning 2</tspan></text>

    <!-- status bar -->
    <rect x="0" y="352" width="740" height="28" fill="#007ACC"/>
    <text x="20" y="370" font-size="12" fill="#FFFFFF">V = 1 &#8212; 1 error stops verification &#183; 1 warning</text>
    <text x="720" y="370" font-size="12" fill="#FFFFFF" text-anchor="end">alphabet of thought</text>
  </g>
  <rect x="0.5" y="0.5" width="739" height="379" rx="8" fill="none" stroke="#3C3C3C"/>
</svg>
